services:
  xyzw-backend:
    image: ghcr.io/l15035964899/xyzw-backend:latest
    container_name: xyzw-backend-nas
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: "3000"
      TZ: Asia/Shanghai
    ports:
      - "3002:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
