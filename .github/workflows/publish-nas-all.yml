name: Publish NAS all-in-one image

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "render-backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "Dockerfile.nas-all"
      - ".dockerignore"
      - ".github/workflows/publish-nas-all.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nas-all
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/xyzw-nas-all:latest
            ghcr.io/${{ github.repository_owner }}/xyzw-nas-all:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
